
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubel Telecom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #050816, #102b59, #06101e);
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 30px 24px;
      text-align: center;
      border: 1px solid #294d80;
      border-radius: 24px;
      background: rgba(8, 19, 40, 0.96);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #1685ff, #6847ff);
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
      color: #ffffff;
    }

    .subtitle {
      color: #b9c8e3;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .field {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #dce8ff;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #345078;
      border-radius: 12px;
      outline: none;
      color: white;
      background: #101e35;
      font-size: 15px;
    }

    input:focus {
      border-color: #3995ff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      color: white;
      background: linear-gradient(90deg, #147dff, #624cff);
    }

    .create {
      color: #dce8ff;
      border: 1px solid #345078;
      background: transparent;
    }

    #message {
      margin-top: 18px;
      color: #8fc5ff;
      font-size: 14px;
      line-height: 1.6;
    }

    footer {
      margin-top: 25px;
      color: #8398b8;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">RT</div>

    <h1>Rubel Telecom</h1>

    <p class="subtitle">
      রুবেল টেলিকমে আপনাকে স্বাগতম।<br>
      আপনার সেবায় আমরা সবসময় প্রস্তুত।
    </p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Gmail Address</label>
        <input
          type="email"
          id="email"
          placeholder="আপনার Gmail লিখুন"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="পাসওয়ার্ড লিখুন"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="btn login" type="submit">
        Login
      </button>

      <button
        class="btn create"
        type="button"
        id="createAccount"
      >
        Create Account
      </button>
    </form>

    <p id="message" role="status"></p>

    <footer>
      © 2026 Rubel Telecom
    </footer>
  </main>

  <script>
    const message = document.getElementById("message");

    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        message.textContent =
          "লগইন সিস্টেম এখনো তৈরি করা হয়নি। পরবর্তী ধাপে এটি যুক্ত করা হবে।";
      });

    document.getElementById("createAccount")
      .addEventListener("click", function() {
        message.textContent =
          "অ্যাকাউন্ট তৈরির সুবিধা পরবর্তী ধাপে যুক্ত করা হবে।";
      });
  </script>
</body>
</html>
