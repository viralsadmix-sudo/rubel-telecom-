name: Update Bangladesh government jobs feed

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_jobs_feed.py"
      - ".github/workflows/update-jobs.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 playwright
      - name: Install Chromium for dynamic job cards
        run: python -m playwright install --with-deps chromium
      - name: Collect official Teletalk openings
        run: python scripts/update_jobs_feed.py
      - name: Save updated feed
        run: |
          if git diff --quiet -- jobs-feed.json; then
            echo "No feed changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jobs-feed.json
            git commit -m "Refresh government jobs feed"
            # Another GitHub Actions workflow may push a commit at the same time.
            # Rebase on the latest main branch before pushing this feed update.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" -eq 3 ]; then
                echo "Could not push feed after 3 attempts."
                exit 1
              fi
              sleep 2
            done
          fi
