name: Update Bangladesh government jobs feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Collect official Teletalk openings
        run: python scripts/update_jobs_feed.py
      - name: Save updated feed
        run: |
          if git diff --quiet -- jobs-feed.json; then
            echo "No feed changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jobs-feed.json
            git commit -m "Refresh government jobs feed"
            git push
          fi
