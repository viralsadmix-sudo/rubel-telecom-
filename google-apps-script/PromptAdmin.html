<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b59"><title>Rubel Telecom — প্রম্পট পরিচালনা</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#17243a;font-family:system-ui,Arial,sans-serif;line-height:1.6}header{background:linear-gradient(135deg,#0b1e42,#102b59,#087ca7);color:#fff;text-align:center;padding:24px 14px}main{max-width:760px;margin:18px auto;padding:0 14px 30px}.card,.item{background:#fff;border:1px solid #dbe4ef;border-radius:16px;padding:18px;margin-bottom:14px}h1,h2{margin:0 0 10px}h2{color:#102b59}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea,button{font:inherit;padding:12px;border:1px solid #cbd6e2;border-radius:10px;width:100%}textarea{min-height:170px}button{background:#087ca7;color:#fff;border:0;font-weight:800;margin-top:10px;cursor:pointer}.danger{background:#b42318}.muted,.status{font-size:14px;color:#526174;white-space:pre-wrap}.item h3{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}</style></head><body><header><h1>Rubel Telecom</h1><p>অ্যাডমিন — AI প্রম্পট পরিচালনা</p></header><main><section class="card" id="login"><h2>🔐 মালিকের PIN</h2><label for="pin">Admin PIN</label><input id="pin" type="password" autocomplete="current-password"><button id="loginBtn">যাচাই করে প্রবেশ করুন</button><p id="loginStatus" class="status"></p></section><section class="card" id="editor" hidden><h2>নতুন প্রম্পট যোগ করুন / সম্পাদনা করুন</h2><input id="promptId" type="hidden"><label for="title">প্রম্পটের নাম</label><input id="title" maxlength="120" placeholder="যেমন: Face Lock Photo Enhancement"><label for="prompt">সম্পূর্ণ প্রম্পট</label><textarea id="prompt" maxlength="12000" placeholder="এখানে সম্পূর্ণ প্রম্পট লিখুন" ></textarea><button id="saveBtn">প্রম্পট সংরক্ষণ করুন</button><button id="clearBtn" type="button" style="background:#526174">নতুন প্রম্পটের জন্য ফর্ম খালি করুন</button><p id="status" class="status"></p><h2>সংরক্ষিত প্রম্পট</h2><div id="items"></div></section><p><a href="?page=admin">← মূল অ্যাডমিন প্যানেল</a></p></main><script>let pin='';const $=id=>document.getElementById(id);function call(method,args,ok,bad){try{const r=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>bad(e.message||String(e)));r[method].apply(r,args);}catch(e){bad('প্রকাশিত Google Apps Script লিংক থেকে খুলুন।');}}function msg(id,t,err=false){$(id).textContent=t;$(id).style.color=err?'#b42318':'#087a3e';}function load(){call('getSavedPrompts',[pin],items=>{const host=$('items');host.innerHTML='';if(!items.length)host.textContent='এখনো কোনো প্রম্পট নেই।';items.forEach(p=>{const box=document.createElement('article');box.className='item';const h=document.createElement('h3');h.textContent=p.title;const t=document.createElement('p');t.textContent=p.prompt.slice(0,220)+(p.prompt.length>220?'…':'');const row=document.createElement('div');row.className='row';const edit=document.createElement('button');edit.textContent='সম্পাদনা';edit.onclick=()=>{$('promptId').value=p.id;$('title').value=p.title;$('prompt').value=p.prompt;window.scrollTo(0,0);};const del=document.createElement('button');del.className='danger';del.textContent='মুছুন';del.onclick=()=>{if(confirm('এই প্রম্পটটি মুছে ফেলবেন?'))call('deletePrompt',[pin,p.id],r=>{msg('status',r.message);load();},e=>msg('status',e,true));};row.append(edit,del);box.append(h,t,row);host.appendChild(box);});},e=>msg('status',e,true));}$('loginBtn').onclick=()=>{pin=$('pin').value.trim();if(!pin){msg('loginStatus','Admin PIN লিখুন।',true);return;}call('getSavedPrompts',[pin],items=>{$('login').hidden=true;$('editor').hidden=false;msg('status','লগইন সফল।');load();},e=>{pin='';msg('loginStatus',e,true);});};$('saveBtn').onclick=()=>{const data={id:$('promptId').value,title:$('title').value.trim(),prompt:$('prompt').value.trim()};if(!data.title||!data.prompt){msg('status','প্রম্পটের নাম ও লেখা দিন।',true);return;}call('savePrompt',[pin,data],r=>{msg('status',r.message);$('promptId').value='';$('title').value='';$('prompt').value='';load();},e=>msg('status',e,true));};$('clearBtn').onclick=()=>{$('promptId').value='';$('title').value='';$('prompt').value='';msg('status','নতুন প্রম্পটের ফর্ম প্রস্তুত।');};</script></body></html>
