<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b59"><title>Rubel Telecom — AI ছবি এডিট</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#17243a;font-family:system-ui,Arial,sans-serif;line-height:1.6}header{background:linear-gradient(135deg,#0b1e42,#102b59,#087ca7);color:white;text-align:center;padding:24px 14px}h1{margin:0}main{max-width:760px;margin:18px auto;padding:0 14px 30px}.card{background:white;border:1px solid #dbe4ef;border-radius:16px;padding:18px;margin-bottom:14px}h2{color:#102b59;margin:0 0 8px}.muted{color:#526174;font-size:14px}.item{border:1px solid #dbe4ef;border-radius:12px;padding:14px;margin:12px 0}.item h3{margin:0 0 8px}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fbff;padding:12px;border-radius:10px;font-size:14px;max-height:220px;overflow:auto}button,a.btn{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:12px;margin-top:9px;font:inherit;font-weight:800;background:#087ca7;color:#fff;text-decoration:none;cursor:pointer}.secondary{background:#102b59!important}.status{white-space:pre-wrap}</style></head><body><header><h1>Rubel Telecom</h1><p>ছবি এডিট করার জন্য এখানে ক্লিক করুন</p></header><main><section class="card"><h2>✨ AI ছবি এডিট</h2><p>একটি প্রম্পট কপি করুন, তারপর ChatGPT বা Gemini খুলে আপনার ছবি যোগ করে প্রম্পটটি পেস্ট করুন।</p><p id="status" class="status muted">প্রম্পট লোড হচ্ছে…</p><div id="list"></div></section><section class="card"><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT খুলুন</a><a class="btn secondary" href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini খুলুন</a><p class="muted">নোট: নিরাপত্তার কারণে প্রম্পট আগে কপি করতে হবে, এরপর AI সাইটে পেস্ট করতে হবে।</p></section><section class="card"><a href="?page=home">← ফিরে যান</a></section></main><script>const statusBox=document.getElementById('status'),list=document.getElementById('list');function show(items){list.innerHTML='';if(!items||!items.length){statusBox.textContent='এখনো কোনো প্রম্পট যোগ করা হয়নি।';return;}statusBox.textContent=items.length+'টি প্রম্পট পাওয়া গেছে।';items.forEach(p=>{const box=document.createElement('article');box.className='item';const h=document.createElement('h3');h.textContent=p.title;const body=document.createElement('div');body.className='prompt';body.textContent=p.prompt;const copy=document.createElement('button');copy.textContent='প্রম্পট কপি করুন';copy.onclick=async()=>{try{await navigator.clipboard.writeText(p.prompt);copy.textContent='কপি হয়েছে ✓';}catch(e){const ta=document.createElement('textarea');ta.value=p.prompt;box.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copy.textContent='কপি হয়েছে ✓';}};box.append(h,body,copy);list.appendChild(box);});}try{google.script.run.withSuccessHandler(show).withFailureHandler(e=>statusBox.textContent='প্রম্পট লোড হয়নি: '+(e.message||e)).getPublicPrompts();}catch(e){statusBox.textContent='এই পেজটি প্রকাশিত Google Apps Script ওয়েব অ্যাপ থেকে খুলুন।';}</script></body></html>
