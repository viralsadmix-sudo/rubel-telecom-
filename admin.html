<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b59"><title>Rubel Telecom — অ্যাডমিন প্যানেল</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#17243a;font-family:system-ui,-apple-system,"Noto Sans Bengali",Arial,sans-serif;line-height:1.6}header{background:linear-gradient(135deg,#0b1e42,#102b59,#087ca7);color:#fff;text-align:center;padding:25px 15px}header h1{margin:0;font-size:27px}header p{margin:6px 0 0;color:#e6f5ff}main{max-width:900px;margin:18px auto;padding:0 14px 28px}.card{background:#fff;border:1px solid #dbe4ef;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 6px 20px #102b590d}h2{margin:0 0 10px;color:#102b59;font-size:21px}label{display:block;font-weight:750;margin:12px 0 5px}input,button{font:inherit;padding:12px;border:1px solid #cbd6e2;border-radius:10px}input{display:block;width:100%}button{background:#087ca7;color:white;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row button{flex:1}.muted{font-size:14px;color:#526174}.status{white-space:pre-wrap;margin-top:10px}.hidden{display:none!important}#records{display:grid;gap:12px}.record{background:#fbfdff;border:1px solid #dbe4ef;border-radius:13px;padding:14px;overflow-wrap:anywhere}.record h3{margin:0 0 5px;font-size:18px}.record p{margin:5px 0}.record img{display:block;max-width:100%;max-height:380px;object-fit:contain;border-radius:10px;margin:10px 0}.record a{color:#087ca7;font-weight:750}.back{color:#087ca7;font-weight:750;text-decoration:none}footer{text-align:center;color:#526174;font-size:13px;padding:8px 12px 24px}
</style></head><body><header><h1>Rubel Telecom</h1><p>মালিকের অ্যাডমিন প্যানেল</p></header><main>
<section class="card" id="login"><h2>🔐 মালিকের লগইন</h2><p>আপনার Appwrite অ্যাকাউন্টের ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।</p><form id="loginForm"><label for="email">ইমেইল</label><input id="email" type="email" autocomplete="username" required><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required><div class="row" style="margin-top:14px"><button id="loginBtn" type="submit">লগইন করুন</button></div></form><div id="loginStatus" class="status" role="status" aria-live="polite"></div><p class="muted">পাসওয়ার্ড এই পেজে সংরক্ষণ করা হয় না।</p></section>
<section class="card hidden" id="dashboard"><div class="row"><h2 style="flex:1;margin:0">📥 কাস্টমারের জমা</h2><button id="refresh">রিফ্রেশ</button><button id="logout">লগআউট</button></div><div id="dashStatus" class="status" role="status" aria-live="polite"></div><div id="records"></div></section>
<section class="card"><a class="back" href="./index.html">← মূল ওয়েবসাইটে ফিরে যান</a></section></main><footer>© Rubel Telecom — গ্রাহকের তথ্য ব্যক্তিগত রাখুন</footer>
<script src="https://cdn.jsdelivr.net/npm/appwrite@28.3.0"></script>
<script>
const {Client,Account,Storage,TablesDB,Query}=window.Appwrite;
const client=new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('6aceec5b0017856576f7'),account=new Account(client),storage=new Storage(client),tables=new TablesDB(client);
const login=document.getElementById('login'),dash=document.getElementById('dashboard'),loginForm=document.getElementById('loginForm'),loginStatus=document.getElementById('loginStatus'),dashStatus=document.getElementById('dashStatus'),records=document.getElementById('records'),loginBtn=document.getElementById('loginBtn');
function msg(el,text,error=false){el.textContent=text||'';el.style.color=error?'#b42318':'#087a3e';}
const OWNER_ID='6acf08cc00087539c14d';
function niceError(e){
 const s=String(e&&e.message?e.message:'সংযোগে সমস্যা হয়েছে।');
 const type=String(e&&e.type?e.type:'');
 if(s.includes('Failed to fetch'))return 'Appwrite সার্ভারে সংযোগ হচ্ছে না। Appwrite Console → Settings → Platforms-এ viralsadmix-sudo.github.io যোগ আছে কি না দেখতে হবে।';
 if(type==='user_invalid_credentials'||type==='user_not_found'||/invalid credentials|email.*password|user.*not found/i.test(s))return 'ইমেইল বা পাসওয়ার্ড মেলেনি, অথবা এই ইমেইলে Appwrite-এর Users তালিকায় অ্যাকাউন্ট নেই। Gmail-এর পাসওয়ার্ড নয়—Appwrite ব্যবহারকারী অ্যাকাউন্টের পাসওয়ার্ড দিন।';
 if(type==='user_session_not_found'||s.includes('user_session_not_found'))return 'লগইন সেশন পাওয়া যায়নি। আবার ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।';
 if(s.toLowerCase().includes('permission')||s.includes('authorized'))return 'লগইন হয়েছে, কিন্তু Appwrite Table-এর Read permission এই মালিকের অ্যাকাউন্টের জন্য নেই।';
 return s;
}
async function openOwnerDashboard(){
 const user=await account.get();
 if(user.$id!==OWNER_ID){
  throw new Error('মালিকের অ্যাকাউন্ট মেলেনি। বর্তমানে লগইন করা Appwrite User ID: '+user.$id+' । নির্ধারিত মালিকের ID: '+OWNER_ID+' । এই ID মিলিয়ে নিতে হবে।');
 }
 login.classList.add('hidden');dash.classList.remove('hidden');await loadRows();
}
async function loadRows(){
 msg(dashStatus,'কাস্টমারের জমা লোড হচ্ছে…');records.innerHTML='';
 try{
  const result=await tables.listRows({databaseId:'6acef39300396782af9e',tableId:'6acef7960018db31017f',queries:[Query.orderDesc('$createdAt'),Query.limit(100)]});
  const rows=result.rows||[];msg(dashStatus,rows.length?'মোট '+rows.length+'টি জমা দেখা যাচ্ছে।':'এখনো কোনো জমা নেই।');
  if(!rows.length){records.innerHTML='<p class="muted">কাস্টমারের জমা এখানে দেখা যাবে।</p>';return;}
  for(const row of rows){
   const card=document.createElement('article');card.className='record';
   const h=document.createElement('h3');h.textContent=row.customer_name||'নাম নেই';card.appendChild(h);
   const p=document.createElement('p');p.textContent='ফোন: '+(row.phone||'—');card.appendChild(p);
   const work=document.createElement('p');work.textContent='কাজের বিবরণ: '+(row.work_description||'উল্লেখ নেই');card.appendChild(work);
   const date=document.createElement('p');date.className='muted';date.textContent='জমা: '+(row.$createdAt?new Date(row.$createdAt).toLocaleString('bn-BD'):'—');card.appendChild(date);
   const id=row.photo_file_id;
   if(id){
    try{
      const meta=await storage.getFile({bucketId:'6aceef430035c78dd682',fileId:id}),view=storage.getFileView({bucketId:'6aceef430035c78dd682',fileId:id});
      const a=document.createElement('a');a.href=view;a.target='_blank';a.rel='noopener';a.textContent='📎 '+(meta.name||'ছবি/ডকুমেন্ট খুলুন');card.appendChild(a);
      if(String(meta.mimeType||'').startsWith('image/')){const img=document.createElement('img');img.src=view;img.alt='কাস্টমারের জমা দেওয়া ছবি';img.loading='lazy';card.appendChild(img);}
    }catch(e){const p2=document.createElement('p');p2.textContent='ফাইল দেখানো যায়নি: '+niceError(e);card.appendChild(p2);}
   }else{const p2=document.createElement('p');p2.textContent='এই জমার সঙ্গে ছবির File ID নেই।';card.appendChild(p2);}
   records.appendChild(card);
  }
 }catch(e){msg(dashStatus,'জমাগুলো লোড হয়নি: '+niceError(e),true);}
}
loginForm.addEventListener('submit',async e=>{
 e.preventDefault();loginBtn.disabled=true;msg(loginStatus,'লগইন হচ্ছে…');
 try{
  await account.createEmailPasswordSession({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  await openOwnerDashboard();
 }catch(err){msg(loginStatus,'লগইন হয়নি: '+niceError(err)+(err&&err.code?' (কোড: '+err.code+')':'')+(err&&err.type?' (ধরন: '+err.type+')':''),true);}
 finally{loginBtn.disabled=false;}
});
document.getElementById('refresh').addEventListener('click',loadRows);
document.getElementById('logout').addEventListener('click',async()=>{try{await account.deleteSession({sessionId:'current'});}catch(e){}dash.classList.add('hidden');login.classList.remove('hidden');loginForm.reset();records.innerHTML='';msg(loginStatus,'লগআউট হয়েছে।');});
(async()=>{try{await openOwnerDashboard();}catch(e){if(e&&e.message&&e.message.includes('নির্ধারিত মালিকের'))msg(loginStatus,e.message,true);}})();
</script></body></html>
